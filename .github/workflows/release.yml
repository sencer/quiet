name: Release Linux Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive_name: quiet-x86_64-unknown-linux-gnu
            apt_packages: ""
            c_compiler: gcc
            cargo_env: ""
          - target: x86_64-unknown-linux-musl
            archive_name: quiet-x86_64-unknown-linux-musl
            apt_packages: musl-tools
            c_compiler: musl-gcc
            cargo_env: ""
          - target: aarch64-unknown-linux-gnu
            archive_name: quiet-aarch64-unknown-linux-gnu
            apt_packages: gcc-aarch64-linux-gnu
            c_compiler: aarch64-linux-gnu-gcc
            cargo_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build quiet daemon
        run: |
          ${{ matrix.cargo_env }} cargo build --release --target ${{ matrix.target }}

      - name: Build quietctl client
        run: |
          ${{ matrix.c_compiler }} -O3 -Wall -Wextra -Wl,-O1,--as-needed,-z,now -s tools/quietctl.c -o tools/quietctl

      - name: Package release archive
        run: |
          STAGING_DIR="${{ matrix.archive_name }}"
          mkdir -p "$STAGING_DIR"
          cp "target/${{ matrix.target }}/release/quiet" "$STAGING_DIR/quiet"
          cp "tools/quietctl" "$STAGING_DIR/quietctl"
          cp README.md "$STAGING_DIR/README.md"
          tar -czvf "${{ matrix.archive_name }}.tar.gz" -C "$STAGING_DIR" .
          sha256sum "${{ matrix.archive_name }}.tar.gz" > "${{ matrix.archive_name }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}.tar.gz
            ${{ matrix.archive_name }}.tar.gz.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release_assets/ \;
          cd release_assets
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "TAG_NAME=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Quiet ${{ steps.tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*.tar.gz
            release_assets/SHA256SUMS.txt
